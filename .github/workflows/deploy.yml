name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LMS/tochka-sborki/web/**'
      - 'LMS/registry.json'
      - 'academy/**'
      - 'workers/**'
      - '.github/workflows/deploy.yml'

env:
  CF_ACCOUNT: '252b28b0ef2e1866c532e2622060c809'

jobs:
  # ── ai.synergify.com (course) ──────────────────────────────
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: LMS/tochka-sborki/web/package-lock.json
      - name: Install
        working-directory: LMS/tochka-sborki/web
        run: npm ci
      - name: Build
        working-directory: LMS/tochka-sborki/web
        run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          npx wrangler pages deploy LMS/tochka-sborki/web/out \
            --project-name=tochka-sborki \
            --branch=main \
            --commit-message="${{ github.sha }}"

  # ── engine × course-packs: build+test matrix (no deploy) ───
  # «Движок обновился → все курсы пересобрались» как CI-факт: каждый
  # coming-soon pack собирается и прогоняет тесты под своим COURSE_PACK.
  # Новый pack? Добавь его slug в matrix.pack ниже.
  # (tochka-sborki уже собирается в deploy-web — сюда идут остальные.)
  build-packs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pack: ['living-practice']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: LMS/tochka-sborki/web/package-lock.json
      - name: Install
        working-directory: LMS/tochka-sborki/web
        run: npm ci
      - name: Build (pack)
        working-directory: LMS/tochka-sborki/web
        env:
          COURSE_PACK: ${{ matrix.pack }}
        run: npm run build
      - name: Test (pack)
        working-directory: LMS/tochka-sborki/web
        env:
          COURSE_PACK: ${{ matrix.pack }}
        run: npx vitest run

  # ── academy.synergify.com (S.A.S.H.A academy) ──────────────
  deploy-academy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: academy/package-lock.json
      - name: Install
        working-directory: academy
        run: npm ci
      - name: Build
        working-directory: academy
        run: npm run build
      - name: Ensure project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          npx wrangler pages project create synergify-academy \
            --production-branch=main || echo "Project already exists"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          npx wrangler pages deploy academy/out \
            --project-name=synergify-academy \
            --branch=main \
            --commit-message="${{ github.sha }}"

  # ── workers (platform API) ────────────────────────────────
  deploy-workers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json
      - name: Install
        working-directory: workers
        run: npm ci
      - name: Deploy
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: npx wrangler deploy
